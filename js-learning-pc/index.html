<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body {
        background-color: black;
        color: white;
    }
</style>

<body>


    <ul class="ulli">
        <li>Name</li>
    </ul>




    <script>

        function myLang(myoptilang) {

            const li = document.createElement('li');
            li.appendChild(document.createTextNode(myoptilang));
            document.querySelector('.ulli').appendChild(li)


        }

        myLang('duolingo')
        myLang('alphaXd')
        myLang('UltraPower')
        myLang('ommiVerse')
    </script>

</body>

</html>
