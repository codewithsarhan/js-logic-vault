
<!DOCTYPE html>
<html>
<body>
  <h2>Daily Goal Tracker</h2>

  <p id="summary">Your progress will appear here.</p>
  <ul id="goalList"></ul>

  <button id="checkBtn">Check Progress</button>

  <script>
    const goals = [
      { name: "Learn JavaScript", completed: true },
      { name: "Practice arrays", completed: false },
      { name: "Build a project", completed: true }
    ];

    const summary = document.getElementById("summary");
    const goalList = document.getElementById("goalList");
    const button = document.getElementById("checkBtn");

    button.addEventListener("click", function () {
      let completedCount = 0;

      goals.forEach(function (goal) {
        if (goal.completed === true) {
          completedCount++;
        }
        

        goalList.innerHTML +=
          `<li>${goal.name} - ${goal.completed ? "Done" : "Pending"}</li>`;
      });

      summary.textContent =
        "Completed: " + completedCount + " / " + goal.length;

      if (completedCount === goals.length) {
        summary.textContent = "All goals completed!";
      }
    });
  </script>
</body>
</html>
